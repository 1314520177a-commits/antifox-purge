# antifox-purge —— 自带破甲能力的 Antifox 部署栈
#
#   1) cp .env.example .env         # 至少填 POSTGRES_PASSWORD
#   2) docker compose up -d --build # 首次构建前端+Go（5~15 分钟，取决于网络）
#   3) 打开 http://<host>:8787      # 首次进入 setup 页建管理员
#
# 破甲层已在镜像里，开箱即生效：
#   · skills/pierce-core / pierce-chain 内嵌在二进制里（首启物化到 data/skills）
#   · 所有 agent 的系统提示尾部带 PIERCE-CORE 常驻协议（代码注入，网页改不掉）
#   · guard 的破坏性/外带拦截已放行
#
# 想换成「拉预构建镜像」而不是本地编译：
#   image: ghcr.io/<你的用户名>/antifox-purge:latest   # push 后由 GitHub Actions 构建
#   并删掉下面的 build: 段

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antifox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-antifox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antifox} -d ${POSTGRES_DB:-antifox}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  antifox:
    build:
      context: .
      args:
        WITH_BROWSER: ${WITH_BROWSER:-1}
    image: antifox-purge:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTIFOX_PG_DSN: postgres://${POSTGRES_USER:-antifox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-antifox}?sslmode=disable
      # skill 目录指向挂载点（优先于 <dataDir>/skills），改 skill 不用重建镜像
      ANTIFOX_SKILL_DIR: /app/skills
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTIFOX_LLM_PROVIDER: ${ANTIFOX_LLM_PROVIDER:-}
      ANTIFOX_LLM_MODEL: ${ANTIFOX_LLM_MODEL:-}
      ANTIFOX_LLM_BASE_URL: ${ANTIFOX_LLM_BASE_URL:-}
      ANTIFOX_LLM_PROXY: ${ANTIFOX_LLM_PROXY:-}
    ports:
      - "8787:8787"   # Web UI + API
      - "8788:8788"   # 流量记录代理（给目标浏览器/工具挂代理用）
    volumes:
      # data/ 持久化：jwt.key、流量、报告、转录
      - ./data:/app/data
      # skills 用宿主目录（配合 ANTIFOX_SKILL_DIR），加/改 skill 立即生效
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
